[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tenant-control-plane"
version = "0.1.0"
description = "Asynchronous tenant provisioning control plane"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aio-pika>=9.4",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "injector>=0.22",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "bandit>=1.7",
    "httpx>=0.27",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cp", "src/function"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
explicit_package_bases = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
